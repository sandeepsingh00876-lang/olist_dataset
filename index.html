<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Seller Dashboard</h1>
    <div class="charts-container">

    <div class="chart-box">
        <div class="chart-header">
            <h3>Top 10 Sellers by Revenue</h3>
        </div>
        <canvas id="sellerChart"></canvas>
</div>

    <div class="chart-box">
        <div class="chart-header">
            <h3>Top 10 Sellers by Total Orders</h3>
        </div>
        <canvas id="sellerOrderChart"></canvas>

</div>

    <div class="chart-box">
        <div class="chart-header">
            <h3>Top 10 Sellers by Total Products</h3>
        </div>
        <canvas id="SellerProductChart"></canvas>
    </div>

    <div class="chart-box">
        <div class="chart-header">
            <h3>Top 10 Sellers by Avg Order Value</h3>
        </div>
        <canvas id="SellerAvgOrderValue"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="javascript.js"></script>

</body>
</html>
